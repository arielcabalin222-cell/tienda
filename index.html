<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tumarca.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ecebe8;--surface:#f6f5f2;--fg:#111214;--muted:#6b6d70;--line:#d3d2ce;--accent:#1d3fd8;--accent-fg:#fff;--sale:#d42a1c;--tile1:#c9c8c3;--tile2:#b4b3ae;--wa:#1faa59;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f11;--surface:#17181b;--fg:#efeeea;--muted:#8d8f93;--line:#2a2c30;--accent:#6f8bff;--accent-fg:#0e0f11;--sale:#ff6a5c;--tile1:#26282c;--tile2:#1c1d20;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f11;--surface:#17181b;--fg:#efeeea;--muted:#8d8f93;--line:#2a2c30;--accent:#6f8bff;--accent-fg:#0e0f11;--sale:#ff6a5c;--tile1:#26282c;--tile2:#1c1d20;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--display);font-stretch:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--mono);letter-spacing:.02em}
.promo{background:var(--fg);color:var(--bg);text-align:center;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{text-decoration:none;color:var(--fg);font-weight:900;font-stretch:125%;font-size:24px;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.icon-btn{position:relative;width:44px;height:44px;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.count{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font:500 10px/18px var(--mono);text-align:center;padding:0 5px}
.count[data-n="0"]{display:none}
.hero{padding-block:40px 32px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{margin:12px 0 0;font-weight:900;font-stretch:125%;font-size:clamp(44px,13vw,96px);line-height:.88;letter-spacing:-.045em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
h1 .dot{color:var(--accent)}
.hero p{max-width:34ch;color:var(--muted);margin:16px 0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);font-weight:700;font-stretch:110%;padding:14px 22px;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.btn.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.hero-row{display:flex;gap:10px;flex-wrap:wrap}
.ticker{overflow:hidden;border-block:1px solid var(--line);white-space:nowrap;padding:10px 0;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ticker div{display:inline-block;padding-left:100%;animation:tick 26s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker div{animation:none;padding-left:16px}}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-block:24px 36px}
.facts div{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--fg);padding-top:10px}
.facts b{font-weight:800;font-stretch:115%;font-size:18px;text-transform:uppercase;letter-spacing:-.02em}
.facts span{font-size:12px;color:var(--muted)}
.crumb{padding:14px 0 0;font:500 12px var(--mono);text-transform:uppercase;color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;padding-block:16px 12px}
.tools h2{margin:0;font-weight:800;font-stretch:115%;font-size:22px;text-transform:uppercase;letter-spacing:-.02em}
.tools .mono{font-size:12px;color:var(--muted)}
.filter-btn{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--fg);font:700 12px var(--display);font-stretch:110%;text-transform:uppercase;letter-spacing:.04em}
.filter-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.count.in{position:static}
.chip{flex:none;padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;padding-bottom:40px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,var(--tile1),var(--tile2));display:grid;place-items:center;overflow:hidden}
.ph svg{width:62%;fill:none;stroke:var(--fg);stroke-width:1.4;opacity:.55}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .tag{position:absolute;left:8px;bottom:8px;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.badge{position:absolute;top:8px;left:8px;background:var(--sale);color:#fff;font:500 11px/1 var(--mono);padding:5px 7px}
.badge.new{background:var(--accent);color:var(--accent-fg)}
.name{font-weight:600;font-size:14px;line-height:1.25;text-wrap:balance}
.price{display:flex;gap:8px;align-items:baseline;font:500 14px var(--mono)}
.price s{color:var(--muted);font-size:12px}
.sizes{display:flex;flex-wrap:wrap;gap:4px}
.szl{flex-basis:100%;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sz{min-width:30px;height:28px;padding:0 6px;border:1.5px solid var(--line);font:500 11px var(--mono)}
.sz[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.add{width:100%;padding:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-stretch:110%;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.none{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--muted)}
.drop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-bottom:40px}
@media(min-width:700px){.drop-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.drop-tile{display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1;padding:12px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.drop-tile:hover{border-color:var(--fg)}
.drop-tile .dn{font-weight:900;font-stretch:125%;font-size:34px;letter-spacing:-.04em;line-height:1}
.drop-tile .dc{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase}
.news{background:var(--fg);color:var(--bg);padding-block:36px}
.news h3{margin:0 0 6px;font-weight:900;font-stretch:125%;font-size:28px;text-transform:uppercase;letter-spacing:-.03em;line-height:1}
.news p{margin:0 0 16px;opacity:.7}
.news form{display:flex;gap:8px}
.news input{flex:1;min-width:0;padding:14px;background:transparent;border:1.5px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);font:inherit;border-radius:0}
.news input::placeholder{color:color-mix(in srgb,var(--bg) 55%,transparent)}
.news button{background:var(--bg);color:var(--fg);font-weight:700;padding:0 18px;text-transform:uppercase;font-size:12px}
footer{padding-block:28px 96px;font-size:12px;color:var(--muted)}
footer nav{display:flex;gap:20px;margin-bottom:14px;font:500 12px var(--mono);text-transform:uppercase;color:var(--fg)}
footer a{color:inherit}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.wa svg{width:28px;height:28px;fill:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.sheet,.drawer,.fsheet{position:fixed;background:var(--surface);z-index:31;display:flex;flex-direction:column}
.sheet{right:0;top:0;bottom:0;width:min(420px,100%);padding-top:env(safe-area-inset-top,0px)}
.drawer{left:0;top:0;bottom:0;width:min(360px,88%);padding-top:env(safe-area-inset-top,0px)}
.fsheet{left:0;right:0;bottom:0;max-height:85%;max-width:560px;margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-weight:800;font-stretch:115%;text-transform:uppercase;font-size:18px}
.lines{flex:1;overflow:auto;padding:8px 16px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .ph svg{width:70%}
.line .n{font-weight:600;font-size:13px;line-height:1.25}
.line .s{font:400 11px var(--mono);color:var(--muted)}
.qty{display:flex;align-items:center;gap:2px;margin-top:6px}
.qty button{width:28px;height:28px;border:1.5px solid var(--line);font:500 14px var(--mono)}
.qty span{min-width:24px;text-align:center;font:500 13px var(--mono)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.sheet-f{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;justify-content:space-between;font:500 14px var(--mono)}
.row.disc{color:var(--accent)}
.row.tot{font-size:17px}
.go{display:flex;justify-content:center;gap:8px;background:var(--wa);color:#fff;padding:15px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.04em;text-decoration:none}
.go[aria-disabled="true"]{opacity:.4;pointer-events:none}
.note{font-size:11px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font:500 12px var(--mono);padding:10px 14px;z-index:40}
.m-item{display:flex;width:100%;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font:600 14px var(--display);font-stretch:110%;text-transform:uppercase;letter-spacing:.02em;text-align:left;color:var(--fg);text-decoration:none}
.m-item.all{color:var(--accent)}
.m-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.m-label{margin:20px 0 10px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lines>.m-label:first-child{margin-top:12px}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="promo" id="promo"></div>
<header><div class="wrap bar">
  <button class="icon-btn" id="open-menu" aria-label="Abrir menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <a class="logo" href="#" data-view="home" aria-label="Inicio"></a>
  <button class="icon-btn" id="open-cart" aria-label="Abrir carrito"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="count" id="count" data-n="0">0</span></button>
</div></header>

<main>
<div id="home">
<section class="wrap hero">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p id="tagline"></p>
  <div class="hero-row"><button class="btn" data-view="shop" data-cat="Todos">Ver todos los productos</button><button class="btn alt" data-view="drops">Drops</button></div>
</section>
<div class="ticker"><div id="ticker"></div></div>
<section class="wrap facts" id="facts"></section>
</div>

<div id="drops" hidden>
<section class="wrap">
  <button class="crumb" data-view="home">← Inicio</button>
  <div class="tools"><div><h2>Drops</h2><span class="mono" id="drops-range"></span></div><button class="filter-btn" data-view="shop" data-cat="Drops">Ver todos</button></div>
  <div class="drop-grid" id="drop-grid"></div>
</section>
</div>

<div id="shop" hidden>
<section class="wrap">
  <button class="crumb" data-view="home">← Inicio</button>
  <div class="tools">
    <div><h2 id="ttl">Todos los productos</h2><span class="mono" id="num"></span></div>
    <button class="filter-btn" id="open-filters"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Filtrar<span class="count in" id="fcount" data-n="0">0</span></button>
  </div>
  <div class="grid" id="grid"></div>
</section>
</div>

<section class="news"><div class="wrap">
  <h3 id="news-t"></h3><p id="news-p"></p>
  <form id="nf"><input id="email" type="email" required placeholder="tu@email.com" aria-label="Email"><button>Enviar</button></form>
</div></section>
</main>

<footer><div class="wrap">
  <nav><a href="#">Inicio</a><a href="#" data-view="shop" data-cat="Todos">Productos</a><a data-wa target="_blank" rel="noopener">Contacto</a></nav>
  <div class="mono" id="wa-label"></div>
  <p id="legal"></p>
</div></footer>

<a class="wa" data-wa target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.4-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.7-.1 1.3z"/></svg></a>

<div id="menu" hidden>
  <div class="scrim" id="scrim-menu"></div>
  <nav class="drawer" aria-label="Menú">
    <div class="sheet-h"><div class="logo"></div><button class="icon-btn" id="close-menu" aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="lines">
      <button class="m-item" data-view="home"><span>Inicio</span></button>
      <button class="m-item all" data-view="shop" data-cat="Todos"><span>Ver todos los productos</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="m-label">Categorías</div>
      <div id="m-cats"></div>
      <a class="m-item" data-wa target="_blank" rel="noopener"><span>Contacto</span></a>
    </div>
    <div class="sheet-f"><button class="m-item" id="theme"><span>Cambiar tema claro / oscuro</span></button></div>
  </nav>
</div>
<div id="filters" hidden>
  <div class="scrim" id="scrim-f"></div>
  <div class="fsheet" role="dialog" aria-label="Filtros">
    <div class="sheet-h"><h3>Filtrar</h3><button class="icon-btn" id="close-f" aria-label="Cerrar filtros"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="lines">
      <div class="m-label">Categoría</div><div class="chipwrap" id="f-cat"></div>
      <div id="f-dropwrap" hidden><div class="m-label">Drop</div><div class="chipwrap" id="f-drop"></div></div>
      <div class="m-label">Talle</div><div class="chipwrap" id="f-size"></div>
      <div class="m-label">Ordenar por</div><div class="chipwrap" id="f-sort"></div>
    </div>
    <div class="sheet-f"><div style="display:grid;grid-template-columns:auto 1fr;gap:10px"><button class="btn alt" id="f-clear">Limpiar</button><button class="btn" id="f-apply" style="justify-content:center">Ver</button></div></div>
  </div>
</div>
<div id="layer" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" role="dialog" aria-label="Carrito">
    <div class="sheet-h"><h3>Carrito</h3><button class="icon-btn" id="close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="lines" id="lines"></div>
    <div class="sheet-f">
      <div class="row"><span>Subtotal</span><span id="sub"></span></div>
      <div class="row disc"><span id="dlabel"></span><span id="dsc"></span></div>
      <div class="row tot"><span>Total</span><span id="tot"></span></div>
      <a class="go" id="go" href="#" target="_blank" rel="noopener" aria-disabled="true">Finalizar por WhatsApp</a>
      <div class="note">Coordinás pago y envío por WhatsApp.</div>
    </div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* CONFIGURACIÓN: editá solo este bloque y la lista de productos P */
const CONFIG={
  brand:{name:"tumarca",suffix:".com"},
  whatsapp:"5491100000000",
  whatsappLabel:"+54 9 11 0000 0000",
  discount:10,
  discountLabel:"Efectivo / transferencia",
  promo:"10% off en efectivo o transferencia",
  eyebrow:"Ciudad · Ropa streetwear",
  tagline:"Una frase corta que presente la marca. Piezas por drop, talles reales y envíos a todo el país.",
  facts:[["10% off","Efectivo o transferencia"],["Drops","Pocas unidades por tanda"],["Envíos","A todo el país"]],
  drops:19,
  newsTitle:"Avisos de drop",
  newsText:"Te escribimos cuando sale el próximo. Sin spam.",
  legal:"Tu Marca · Todos los derechos reservados. Defensa de las y los consumidores. Botón de arrepentimiento.",
  categories:["Pantalones baggy","Bermudas baggy","Remeras","Musculosas","Camisas","Abrigos","Zapatillas"]
};
/* n: nombre · p: precio · old: precio anterior (opcional) · cat: categoría · s: talles · t: dibujo (pant, short, tee, hood) · drop: nº de drop · img: link de foto (opcional) */
const P=[
 {id:1,n:"Pantalón baggy negro",p:48000,cat:"Pantalones baggy",s:["S","M","L","XL"],t:"pant",drop:3,img:""},
 {id:2,n:"Bermuda baggy gris",p:36000,cat:"Bermudas baggy",s:["38","40","42"],t:"short",drop:3,img:""},
 {id:3,n:"Remera boxy fit blanca",p:28000,cat:"Remeras",s:["S","M","L"],t:"tee",drop:2,img:""},
 {id:4,n:"Buzo con capucha",p:62000,old:78000,cat:"Abrigos",s:["M","L"],t:"hood",drop:2,img:""},
 {id:5,n:"Jean recto celeste",p:52000,cat:"Pantalones baggy",s:["38","40","42","44"],t:"pant",drop:1,img:""},
 {id:6,n:"Remera over de lino",p:25000,old:35000,cat:"Remeras",s:["S","M","L"],t:"tee",drop:1,img:""}
];
const C=CONFIG;
const CATS=["Todos","Drops",...C.categories,"Liquidación"];
const SORTS=[["rel","Destacados"],["asc","Menor precio"],["desc","Mayor precio"]];
const SVG={
 pant:'<path d="M18 6h34l5 58H40L35 28l-5 36H13L18 6z"/>',
 short:'<path d="M16 14h38l5 34H40l-5-18-5 18H11l5-34z"/>',
 tee:'<path d="M26 8l-16 10 6 12 7-3v37h24V27l7 3 6-12L44 8c-2 5-6 7-9 7s-7-2-9-7z"/>',
 hood:'<path d="M24 8c2 6 5 9 11 9s9-3 11-9l18 12-6 14-8-3v31H20V31l-8 3-6-14L24 8z"/>'};
const thumb=x=>x.img?`<img src="${x.img}" alt="${x.n}" loading="lazy">`:`<svg viewBox="0 0 70 70">${SVG[x.t]}</svg>`;
const fmt=n=>"$"+n.toLocaleString("es-AR");
const $=id=>document.getElementById(id);
let drop=0,cat="Todos",size="",sort="rel",cart=[],sel={};

function match(x){
  const c=cat==="Todos"||(cat==="Liquidación"?!!x.old:cat==="Drops"?(!drop||x.drop===drop):x.cat===cat);
  return c&&(!size||x.s.includes(size));
}
function filtered(){
  let l=P.filter(match);
  if(sort==="asc")l=[...l].sort((a,b)=>a.p-b.p);
  if(sort==="desc")l=[...l].sort((a,b)=>b.p-a.p);
  return l;
}
const chip=(k,v,on,label)=>`<button class="chip" aria-pressed="${on}" data-k="${k}" data-v="${v}">${label||v}</button>`;
function panel(){
  $("f-cat").innerHTML=CATS.map(c=>chip("c",c,c===cat)).join("");
  const S=[...new Set(P.flatMap(x=>x.s))];
  $("f-size").innerHTML=S.map(s=>chip("z",s,s===size)).join("");
  $("f-dropwrap").hidden=cat!=="Drops";
  $("f-drop").innerHTML=chip("d",0,!drop,"Todos")+Array.from({length:C.drops},(_,i)=>chip("d",i+1,drop===i+1,i+1)).join("");
  $("f-sort").innerHTML=SORTS.map(([v,l])=>chip("o",v,v===sort,l)).join("");
  $("f-apply").textContent="Ver "+filtered().length+" productos";
}
function list(){
  const l=filtered(),n=(cat!=="Todos"?1:0)+(size?1:0)+(drop?1:0);
  $("ttl").textContent=cat==="Todos"?"Todos los productos":cat==="Drops"?(drop?"Drop "+drop:"Todos los drops"):cat;
  $("num").textContent=l.length+(l.length===1?" producto":" productos")+(size?" · talle "+size:"");
  $("fcount").textContent=n;$("fcount").dataset.n=n;
  $("grid").innerHTML=l.length?l.map(x=>{
    const sz=sel[x.id]||x.s[0],off=x.old?Math.round((1-x.p/x.old)*100):0;
    return `<article class="card"><div class="ph">${thumb(x)}
      ${off?`<span class="badge">${off}% OFF</span>`:x.drop===C.drops?`<span class="badge new">NUEVO</span>`:""}
      <span class="tag">${x.img?"":"Foto · "}Drop ${x.drop}</span></div>
      <div class="name">${x.n}</div>
      <div class="price"><span>${fmt(x.p)}</span>${x.old?`<s>${fmt(x.old)}</s>`:""}</div>
      <div class="sizes" aria-label="Talles disponibles"><span class="szl">Talle</span>${x.s.map(s=>`<button class="sz" aria-pressed="${s===sz}" data-id="${x.id}" data-s="${s}">${s}</button>`).join("")}</div>
      <button class="add" data-add="${x.id}">Agregar</button></article>`}).join("")
    :`<div class="none">No hay productos con estos filtros.<br><button class="btn alt" data-clear="1" style="margin-top:14px">Limpiar filtros</button></div>`;
  panel();
}
function menuList(){
  $("m-cats").innerHTML=CATS.filter(c=>c!=="Todos").map(c=>`<button class="m-item" data-go="${c}"><span>${c}</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`).join("");
}
function dropsList(){
  $("drop-grid").innerHTML=Array.from({length:C.drops},(_,i)=>{const n=i+1,c=P.filter(x=>x.drop===n).length;
    return `<button class="drop-tile" data-drop="${n}"><span class="dn">${String(n).padStart(2,"0")}</span><span class="dc">${c?c+(c===1?" prenda":" prendas"):"Agotado"}</span></button>`}).join("");
}
function view(v,c){
  if(c!==undefined){cat=c;size="";drop=0}
  $("home").hidden=v!=="home";$("shop").hidden=v!=="shop";$("drops").hidden=v!=="drops";
  $("menu").hidden=true;$("filters").hidden=true;scrollTo(0,0);
  if(v==="shop")list();
}
function render(){
  const n=cart.reduce((a,l)=>a+l.q,0);$("count").textContent=n;$("count").dataset.n=n;
  $("lines").innerHTML=cart.length?cart.map((l,i)=>{const x=P.find(p=>p.id===l.id);return `<div class="line"><div class="ph">${thumb(x)}</div>
   <div><div class="n">${x.n}</div><div class="s">Talle ${l.s} · ${fmt(x.p)}</div><div class="qty"><button data-q="${i}" data-d="-1" aria-label="Menos">−</button><span>${l.q}</span><button data-q="${i}" data-d="1" aria-label="Más">+</button></div></div>
   <div class="mono">${fmt(x.p*l.q)}</div></div>`}).join(""):`<div class="empty">Tu carrito está vacío.</div>`;
  const sub=cart.reduce((a,l)=>a+P.find(p=>p.id===l.id).p*l.q,0),d=Math.round(sub*C.discount/100);
  $("sub").textContent=fmt(sub);$("dsc").textContent="−"+fmt(d);$("dlabel").textContent=C.discountLabel+" −"+C.discount+"%";
  document.querySelector(".row.disc").hidden=!C.discount;$("tot").textContent=fmt(sub-d);
  const msg="Hola! Quiero comprar:\n"+cart.map(l=>{const x=P.find(p=>p.id===l.id);return `• ${x.n} · talle ${l.s} x${l.q}`}).join("\n")+(C.discount?`\nTotal con ${C.discount}% off: ${fmt(sub-d)}`:`\nTotal: ${fmt(sub-d)}`);
  const go=$("go");go.setAttribute("aria-disabled",cart.length?"false":"true");go.href=cart.length?"https://wa.me/"+C.whatsapp+"?text="+encodeURIComponent(msg):"#";
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1600)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.drop){drop=+t.dataset.drop;cat="Drops";size="";view("shop")}
  else if(t.dataset.view){e.preventDefault();view(t.dataset.view,t.dataset.cat)}
  else if(t.dataset.go){t.dataset.go==="Drops"?view("drops"):view("shop",t.dataset.go)}
  else if(t.dataset.k){const k=t.dataset.k,v=t.dataset.v;if(k==="c"){cat=v;drop=0}if(k==="d")drop=+v;if(k==="z")size=size===v?"":v;if(k==="o")sort=v;list()}
  else if(t.dataset.clear){cat="Todos";size="";drop=0;list()}
  else if(t.classList.contains("sz")){sel[t.dataset.id]=t.dataset.s;list()}
  else if(t.dataset.add){const x=P.find(p=>p.id==t.dataset.add),s=sel[x.id]||x.s[0];const f=cart.find(l=>l.id===x.id&&l.s===s);f?f.q++:cart.push({id:x.id,s,q:1});render();toast("Agregado · talle "+s)}
  else if(t.dataset.q){const l=cart[t.dataset.q];l.q+=+t.dataset.d;if(l.q<1)cart.splice(t.dataset.q,1);render()}
});
$("open-menu").onclick=()=>$("menu").hidden=false;
$("close-menu").onclick=$("scrim-menu").onclick=()=>$("menu").hidden=true;
$("open-filters").onclick=()=>{panel();$("filters").hidden=false};
$("f-apply").onclick=$("scrim-f").onclick=$("close-f").onclick=()=>$("filters").hidden=true;
$("f-clear").onclick=()=>{cat="Todos";size="";drop=0;sort="rel";list()};
$("open-cart").onclick=()=>$("layer").hidden=false;
$("close").onclick=$("scrim").onclick=()=>$("layer").hidden=true;
$("nf").onsubmit=e=>{e.preventDefault();e.target.reset();toast("Listo, te avisamos del próximo drop")};
$("theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
function applyConfig(){
  const b=C.brand;document.title=b.name+b.suffix;
  document.querySelectorAll(".logo").forEach(e=>e.innerHTML=b.name+"<span>"+b.suffix+"</span>");
  $("h1").innerHTML=b.name+'<span class="dot">'+b.suffix+"</span>";
  $("promo").textContent=C.promo;$("promo").hidden=!C.promo;
  $("eyebrow").textContent=C.eyebrow;$("tagline").textContent=C.tagline;
  $("ticker").textContent=(C.categories.slice(0,5).join(" · ")+" · ").repeat(2)+"\u00a0";
  $("facts").innerHTML=C.facts.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join("");
  $("drops-range").textContent="Del 01 al "+String(C.drops).padStart(2,"0");
  document.querySelectorAll("[data-wa]").forEach(a=>a.href="https://wa.me/"+C.whatsapp);
  $("wa-label").textContent="WhatsApp "+C.whatsappLabel;
  $("news-t").textContent=C.newsTitle;$("news-p").textContent=C.newsText;$("legal").textContent=C.legal;
}
applyConfig();menuList();dropsList();list();render();
</script>
</body>
</html>
